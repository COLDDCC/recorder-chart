<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 360" fill="none" role="img" aria-label="Recorder fingering: left hand covers holes 1, 2 and 3 (thumb covers 0), right hand covers holes 4 to 7">

  <!-- recorder (center) -->
  <g transform="translate(230 45)">
    <path d="M-16 75 L16 75 Q20 75 20 81 L20 151 Q20 174 0 178 Q-20 174 -20 151 L-20 81 Q-20 75 -16 75 Z"
          fill="#FFFFFF" stroke="#1C2434" stroke-width="3.2" stroke-linejoin="round"/>
    <path d="M0 84 q-9 2 -11 12" stroke="#D99A12" stroke-width="2.4"/>
    <path d="M-2 174 q7 8 16 10"/>
    <g fill="#4B3FA0">
      <circle cx="0" cy="98" r="3.6"/>
      <circle cx="0" cy="107" r="3.6"/>
      <circle cx="0" cy="116" r="3.6"/>
      <circle cx="0" cy="125" r="3.6"/>
      <circle cx="0" cy="134" r="3.4"/>
      <circle cx="0" cy="142" r="3.4"/>
      <circle cx="0" cy="150" r="3.4"/>
    </g>
    <g font-family="IBM Plex Mono,monospace" font-size="11" text-anchor="middle" fill="#5A6479">
      <text x="24" y="101">1</text>
      <text x="24" y="110">2</text>
      <text x="24" y="119">3</text>
      <text x="24" y="128">4</text>
      <text x="24" y="137">5</text>
      <text x="24" y="145">6</text>
      <text x="24" y="153">7</text>
    </g>
  </g>

  <!-- left hand -->
  <g fill="#EDEAF8" stroke="#1C2434" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="230" cy="66" rx="50" ry="17"/>
    <ellipse cx="174" cy="58" rx="13" ry="25" transform="rotate(12 174 58)"/>
    <rect x="206" y="72" width="15" height="42" rx="7.5"/>
    <rect x="223" y="72" width="15" height="50" rx="7.5"/>
    <rect x="240" y="72" width="15" height="40" rx="7.5"/>
    <rect x="257" y="74" width="13" height="26" rx="6.5"/>
  </g>
  <g fill="#4B3FA0">
    <circle cx="213" cy="120" r="4.5"/>
    <circle cx="230" cy="126" r="4.5"/>
    <circle cx="247" cy="120" r="4.5"/>
  </g>
  <g font-family="Fraunces,serif" font-size="15" font-weight="600" fill="#4B3FA0">
    <text x="213" y="132" text-anchor="middle">1</text>
    <text x="230" y="138" text-anchor="middle">2</text>
    <text x="247" y="132" text-anchor="middle">3</text>
  </g>
  <text x="182" y="44" font-family="IBM Plex Mono,monospace" font-size="16" font-weight="700" fill="#4B3FA0">L</text>

  <!-- right hand -->
  <g fill="#F3E7CC" stroke="#1C2434" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="230" cy="252" rx="54" ry="17"/>
    <ellipse cx="286" cy="254" rx="15" ry="26" transform="rotate(-12 286 254)"/>
    <rect x="208" y="200" width="15" height="56" rx="7.5"/>
    <rect x="225" y="198" width="15" height="58" rx="7.5"/>
    <rect x="242" y="202" width="15" height="48" rx="7.5"/>
    <rect x="259" y="208" width="13" height="34" rx="6.5"/>
  </g>
  <g fill="#C98A0B">
    <circle cx="215" cy="198" r="4.5"/>
    <circle cx="232" cy="196" r="4.5"/>
    <circle cx="249" cy="200" r="4.5"/>
    <circle cx="265" cy="206" r="4.5"/>
  </g>
  <g font-family="Fraunces,serif" font-size="15" font-weight="600" fill="#B0750A">
    <text x="215" y="190" text-anchor="middle">4</text>
    <text x="232" y="188" text-anchor="middle">5</text>
    <text x="249" y="192" text-anchor="middle">6</text>
    <text x="265" y="200" text-anchor="middle">7</text>
  </g>
  <text x="270" y="290" font-family="IBM Plex Mono,monospace" font-size="16" font-weight="700" fill="#B0750A">R</text>
</svg>